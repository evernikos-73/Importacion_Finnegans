name: Exportar saldos a Google Sheets

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  exportar:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      POSTGRES_USER: "inpro2021nubeuser"
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: "infraestructura-aurora-datawarehouse-instance-zxhlvevffc1c.cijt7auhxunw.us-east-1.rds.amazonaws.com"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "finnegansbi"

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        run: python exportar_saldos.py
